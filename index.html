<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>復盤工具</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0F1417; --surface:#161D22; --surface2:#1D262C; --surface3:#232D33;
    --border:#2A343B; --border-soft:#202A30;
    --text:#E7EDEF; --text-dim:#8FA0A8; --text-faint:#5D6C73;
    --long:#4FAE8A; --long-dim:rgba(79,174,138,0.14);
    --short:#C4614A; --short-dim:rgba(196,97,74,0.14);
    --amber:#D4A24E; --amber-dim:rgba(212,162,78,0.14);
    --radius:10px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  h1,h2,h3 { font-family:'Barlow Condensed',sans-serif; font-weight:600; letter-spacing:.02em; margin:0; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .app { max-width:1080px; margin:0 auto; padding:24px 20px 80px; }

  .authgate { max-width:380px; margin:80px auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; text-align:center; }
  .authgate .eyebrow { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-family:'IBM Plex Mono',monospace; }
  .authgate h1 { font-size:26px; margin:6px 0 4px; }
  .authgate p { color:var(--text-dim); font-size:13px; line-height:1.6; margin:0 0 18px; }
  .authgate input { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:10px; }
  .authgate .msg { font-size:12.5px; color:var(--amber); margin-top:10px; min-height:16px; }

  .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .title-block .eyebrow { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-family:'IBM Plex Mono',monospace; }
  .title-block h1 { font-size:28px; margin-top:4px; }
  .title-block .sub { color:var(--text-dim); font-size:12.5px; margin-top:4px; }
  .topbar-actions { display:flex; gap:8px; flex-wrap:wrap; }

  .btn { font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface2); color:var(--text); padding:9px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { border-color:var(--text-faint); background:var(--surface3); }
  .btn-primary { background:var(--amber); color:#241A08; border:1px solid var(--amber); font-weight:600; }
  .btn-primary:hover { background:#E0AF62; }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--text-dim); }
  .icon-btn { background:transparent; border:none; color:var(--text-dim); cursor:pointer; padding:4px 6px; border-radius:6px; }
  .icon-btn:hover { color:var(--text); background:var(--surface2); }

  .sync-note { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin-bottom:16px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--long); flex-shrink:0; }

  .dash-grid { display:grid; grid-template-columns:240px 1fr; gap:14px; margin-bottom:14px; }
  @media (max-width:860px){ .dash-grid{ grid-template-columns:1fr; } }
  .score-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; align-items:center; }
  .score-card .eyebrow { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; align-self:flex-start; }
  .gauge-score { font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:600; display:block; line-height:1; text-align:center; }
  .gauge-grade { color:var(--amber); font-size:12px; text-align:center; display:block; }
  .score-breakdown { width:100%; margin-top:12px; display:flex; flex-direction:column; gap:5px; }
  .score-row { display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); }
  .score-row span:last-child { color:var(--text); font-family:'IBM Plex Mono',monospace; }

  .stat-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:620px){ .stat-strip{ grid-template-columns:repeat(2,1fr);} }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .stat-label { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }
  .stat-value { font-family:'IBM Plex Mono',monospace; font-size:22px; margin-top:6px; font-weight:600; }
  .stat-value.pos{ color:var(--long);} .stat-value.neg{ color:var(--short);}
  .stat-sub { font-size:11.5px; color:var(--text-dim); margin-top:3px; }

  .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  @media (max-width:860px){ .charts-grid{ grid-template-columns:1fr; } }
  .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; height:220px; }
  .chart-title { font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-family:'IBM Plex Mono',monospace; margin-bottom:6px; }

  .filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .range-group { display:flex; gap:3px; background:var(--surface2); border-radius:8px; padding:3px; }
  .range-btn { border:none; background:transparent; color:var(--text-dim); font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer; }
  .range-btn.on { background:var(--amber); color:#241A08; font-weight:600; }
  .select-mini { background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:12px; padding:7px 10px; border-radius:8px; }

  table.trade-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow-x:auto; }
  .trade-table th { text-align:left; padding:9px 10px; color:var(--text-faint); font-size:10.5px; text-transform:uppercase; border-bottom:1px solid var(--border); white-space:nowrap; font-family:'IBM Plex Mono',monospace; }
  .trade-table td { padding:9px 10px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  .trade-table tr:hover td { background:var(--surface2); }
  .mono-cell { font-family:'IBM Plex Mono',monospace; }
  .pos{ color:var(--long);} .neg{ color:var(--short);}
  .badge { display:inline-flex; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.long{ background:var(--long-dim); color:var(--long);} .badge.short{ background:var(--short-dim); color:var(--short);}
  .empty-state { text-align:center; padding:50px 20px; color:var(--text-dim); }

  .overlay { position:fixed; inset:0; background:rgba(6,9,10,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:640px; max-height:88vh; display:flex; flex-direction:column; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border); }
  .modal-head h2 { font-size:19px; }
  .modal-body { padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .modal-foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--border); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .grid-4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;}
  @media (max-width:560px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr 1fr; } }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field-label { font-size:11px; color:var(--text-dim); }
  .field input, .field select, .field textarea { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; outline:none; font-family:'Inter',sans-serif; }
  .field textarea { resize:vertical; }
  .dir-toggle { display:flex; gap:6px; }
  .dir { flex:1; text-align:center; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text-dim); font-size:12.5px; cursor:pointer; }
  .dir.on.long { background:var(--long-dim); color:var(--long); border-color:var(--long); }
  .dir.on.short { background:var(--short-dim); color:var(--short); border-color:var(--short); }
  .notice { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface3); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:8px; font-size:13px; z-index:60; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="authgate" class="authgate hidden">
  <div class="eyebrow">Post-trade Review</div>
  <h1>復盤工具</h1>
  <p>用 Email 登入即可跨裝置同步紀錄。系統會寄一封登入連結給你，不需要記密碼。</p>
  <input id="email-input" type="email" placeholder="you@example.com" />
  <button id="send-link-btn" class="btn btn-primary" style="width:100%; justify-content:center;">寄送登入連結</button>
  <div id="auth-msg" class="msg"></div>
</div>

<div id="app" class="app hidden">
  <div class="sync-note"><span class="dot"></span><span id="sync-email"></span><span style="margin-left:auto; cursor:pointer; color:var(--text-faint);" id="signout-btn">登出</span></div>

  <div class="topbar">
    <div class="title-block">
      <div class="eyebrow">Post-trade Review</div>
      <h1>復盤工具</h1>
      <div class="sub">加密貨幣合約交易日誌 · 雲端同步</div>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="reset-btn">情緒歸零</button>
      <button class="btn btn-primary" id="new-trade-btn">＋ 新增交易</button>
    </div>
  </div>

  <div class="dash-grid">
    <div class="score-card">
      <span class="eyebrow">A2 Score</span>
      <div style="margin-top:14px;">
        <span class="gauge-score" id="score-num">0</span>
        <span class="gauge-grade" id="score-grade">—</span>
      </div>
      <div class="score-breakdown" id="score-breakdown"></div>
    </div>
    <div class="stat-strip" id="stat-strip"></div>
  </div>

  <div class="charts-grid">
    <div class="chart-card"><div class="chart-title">累積損益</div><canvas id="chart-cum"></canvas></div>
    <div class="chart-card"><div class="chart-title">各策略損益</div><canvas id="chart-setup"></canvas></div>
  </div>

  <div class="filter-bar">
    <div class="range-group" id="range-group"></div>
    <select class="select-mini" id="dir-filter">
      <option value="all">全部方向</option><option value="long">只看做多</option><option value="short">只看做空</option>
    </select>
    <select class="select-mini" id="result-filter">
      <option value="all">全部結果</option><option value="win">只看獲利</option><option value="loss">只看虧損</option>
    </select>
  </div>

  <div class="table-wrap"><table class="trade-table">
    <thead><tr><th>日期</th><th>幣種</th><th>方向</th><th>策略</th><th>進場</th><th>出場</th><th>PnL</th><th>RR</th><th>情緒</th><th>錯誤</th><th></th></tr></thead>
    <tbody id="trade-tbody"></tbody>
  </table></div>
</div>

<div id="modal-root"></div>
<div id="notice" class="notice hidden"></div>

<script>
/* ============== CONFIG — 貼上你自己的 Supabase 專案資訊 ============== */
const SUPABASE_URL = 'https://wvmtdkthkujakavrlkja.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2bXRka3Roa3VqYWthdnJsa2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMTc4MzAsImV4cCI6MjEwMjU5MzgzMH0.cKBaaii3rPWJC-7X_r6q_COz3wvmdhuKMWU7w4UQT2o';
/* ===================================================================== */

const sb = (SUPABASE_URL.startsWith('http')) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const SYMBOLS = ['BTC','ETH','SOL','BNB','XRP','DOGE','SUI','ARB','OP','AVAX'];
const SESSIONS = ['亞洲盤','歐洲盤','美盤','交界/其他'];
const EMOTIONS = ['專注','平靜','自信','猶豫','興奮','貪婪','恐懼','焦慮','報復性','疲勞'];
const GOOD_EMOTIONS = new Set(['專注','平靜','自信']);
const MISTAKES = ['無錯誤','追高殺低 FOMO','未設停損','過度交易','提早出場','移動停損','違反計劃','報復性交易','倉位過大','其他'];
const RANGE_KEYS = ['today','week','month','year','all'];
const RANGE_LABEL = { today:'今日', week:'本週', month:'本月', year:'今年', all:'全部' };

let state = { trades: [], user: null, range:'month', dir:'all', result:'all' };
let charts = {};

const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
const todayStr = () => new Date().toISOString().slice(0,10);
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
const fmtUSD = (n) => { const v = Number(n)||0; const sign = v>0?'+':v<0?'-':''; return `${sign}$${Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`; };
const fmtNum = (n,d=2) => Number.isFinite(n) ? Number(n).toFixed(d) : '—';
const clamp = (n,lo,hi) => Math.min(hi, Math.max(lo, n));

function withinRange(dateStr, key) {
  if (key === 'all') return true;
  const d = new Date(dateStr + 'T00:00:00'); const now = new Date();
  if (key === 'today') return dateStr === todayStr();
  if (key === 'week') { const day = now.getDay()===0?7:now.getDay(); const start = new Date(now); start.setDate(now.getDate()-day+1); start.setHours(0,0,0,0); return d >= start; }
  if (key === 'month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  if (key === 'year') return d.getFullYear()===now.getFullYear();
  return true;
}
function computePnl(t) {
  const entry=parseFloat(t.entryPrice), exit=parseFloat(t.exitPrice), size=parseFloat(t.size);
  if (!entry || !exit || !size) return null;
  const qty = size/entry;
  const raw = t.direction==='long' ? (exit-entry)*qty : (entry-exit)*qty;
  return raw - (parseFloat(t.commission)||0);
}
function computeRR(t) {
  const entry=parseFloat(t.entryPrice), exit=parseFloat(t.exitPrice), stop=parseFloat(t.stopLoss);
  if (!entry || !exit || !stop) return null;
  const risk = Math.abs(entry-stop); if (risk===0) return null;
  return Math.abs(exit-entry)/risk;
}
function computeScore(trades) {
  if (!trades.length) return { score:0, grade:'—', winRate:0, profitFactor:0, consistency:0, riskControl:0, emotionMgmt:0 };
  const wins = trades.filter(t=>Number(t.pnl)>0), losses = trades.filter(t=>Number(t.pnl)<0);
  const winRate = (wins.length/trades.length)*100;
  const grossProfit = wins.reduce((s,t)=>s+Number(t.pnl),0);
  const grossLoss = Math.abs(losses.reduce((s,t)=>s+Number(t.pnl),0));
  const profitFactor = grossLoss>0 ? grossProfit/grossLoss : (grossProfit>0?3:0);
  const consistency = (trades.filter(t=>t.mistake==='無錯誤'||!t.mistake).length/trades.length)*100;
  const riskControl = (trades.filter(t=>t.stopLoss && Number(t.stopLoss)>0).length/trades.length)*100;
  const emotionMgmt = (trades.filter(t=>GOOD_EMOTIONS.has(t.emotion)).length/trades.length)*100;
  const score = clamp(winRate*0.20 + clamp(profitFactor/3,0,1)*100*0.25 + consistency*0.20 + riskControl*0.20 + emotionMgmt*0.15, 0, 100);
  const grade = score>=80?'優異':score>=60?'良好':score>=40?'普通':'待加強';
  return { score:Math.round(score), grade, winRate, profitFactor, consistency, riskControl, emotionMgmt };
}

/* ---------------- auth ---------------- */
async function initAuth() {
  if (!sb) {
    document.getElementById('authgate').classList.remove('hidden');
    document.getElementById('auth-msg').textContent = '尚未設定 Supabase URL / anon key，請先完成程式碼最上方的 CONFIG。';
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session) { onSignedIn(session.user); } else { document.getElementById('authgate').classList.remove('hidden'); }
  sb.auth.onAuthStateChange((event, session) => {
    if (session) onSignedIn(session.user);
  });
  document.getElementById('send-link-btn').onclick = async () => {
    const email = document.getElementById('email-input').value.trim();
    const msg = document.getElementById('auth-msg');
    if (!email) { msg.textContent = '請輸入 email'; return; }
    msg.textContent = '寄送中…';
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
    msg.textContent = error ? ('寄送失敗：' + error.message) : '登入連結已寄出，請到信箱點擊連結。';
  };
}
async function onSignedIn(user) {
  state.user = user;
  document.getElementById('authgate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('sync-email').textContent = user.email;
  document.getElementById('signout-btn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  await loadTrades();
  render();
}

/* ---------------- data ---------------- */
async function loadTrades() {
  const { data, error } = await sb.from('trades').select('id, data').order('created_at', { ascending: false });
  if (error) { showNotice('讀取失敗：' + error.message); return; }
  state.trades = (data || []).map(r => ({ ...r.data, id: r.id }));
}
async function saveTrade(t) {
  const isNew = !t.id || !state.trades.some(x => x.id === t.id);
  const id = t.id || crypto.randomUUID();
  const payload = { ...t, id };
  const { error } = isNew
    ? await sb.from('trades').insert({ id, user_id: state.user.id, data: payload })
    : await sb.from('trades').update({ data: payload, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { showNotice('儲存失敗：' + error.message); return; }
  await loadTrades(); render();
}
async function deleteTrade(id) {
  const { error } = await sb.from('trades').delete().eq('id', id);
  if (error) { showNotice('刪除失敗：' + error.message); return; }
  await loadTrades(); render();
}
function showNotice(msg) {
  const el = document.getElementById('notice');
  el.textContent = msg; el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}

/* ---------------- derived ---------------- */
function getFiltered() {
  return state.trades.filter(t => {
    if (!withinRange(t.date, state.range)) return false;
    if (state.dir !== 'all' && t.direction !== state.dir) return false;
    if (state.result === 'win' && !(Number(t.pnl) > 0)) return false;
    if (state.result === 'loss' && !(Number(t.pnl) < 0)) return false;
    return true;
  }).sort((a,b) => (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
}

/* ---------------- render ---------------- */
function render() {
  const filtered = getFiltered();
  const sc = computeScore(filtered);
  document.getElementById('score-num').textContent = sc.score;
  document.getElementById('score-grade').textContent = sc.grade;
  document.getElementById('score-breakdown').innerHTML = `
    <div class="score-row"><span>勝率 Win Rate</span><span>${fmtNum(sc.winRate,0)}%</span></div>
    <div class="score-row"><span>盈虧比 Profit Factor</span><span>${fmtNum(sc.profitFactor)}</span></div>
    <div class="score-row"><span>一致性 Consistency</span><span>${fmtNum(sc.consistency,0)}%</span></div>
    <div class="score-row"><span>風控 Risk Control</span><span>${fmtNum(sc.riskControl,0)}%</span></div>
    <div class="score-row"><span>情緒管理 Emotion</span><span>${fmtNum(sc.emotionMgmt,0)}%</span></div>`;

  const totalPnl = filtered.reduce((s,t)=>s+(Number(t.pnl)||0),0);
  const winCount = filtered.filter(t=>Number(t.pnl)>0).length;
  const lossCount = filtered.filter(t=>Number(t.pnl)<0).length;
  const rrs = filtered.map(computeRR).filter(v=>v!==null);
  const setupMap = {};
  filtered.forEach(t => { const k=(t.setup||'未分類').trim()||'未分類'; setupMap[k]=(setupMap[k]||0)+(Number(t.pnl)||0); });
  const bestSetup = Object.entries(setupMap).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('stat-strip').innerHTML = `
    <div class="stat-card"><div class="stat-label">總損益</div><div class="stat-value ${totalPnl>0?'pos':totalPnl<0?'neg':''}">${fmtUSD(totalPnl)}</div><div class="stat-sub">${RANGE_LABEL[state.range]} · ${filtered.length} 筆</div></div>
    <div class="stat-card"><div class="stat-label">勝率</div><div class="stat-value">${filtered.length?fmtNum(winCount/filtered.length*100,0):'—'}%</div><div class="stat-sub">${winCount} 勝 / ${lossCount} 敗</div></div>
    <div class="stat-card"><div class="stat-label">平均 RR</div><div class="stat-value">${rrs.length?fmtNum(rrs.reduce((a,b)=>a+b,0)/rrs.length):'—'}</div><div class="stat-sub">依停損/出場價計算</div></div>
    <div class="stat-card"><div class="stat-label">最佳策略</div><div class="stat-value" style="font-size:15px;">${bestSetup?escapeHtml(bestSetup[0]):'—'}</div><div class="stat-sub">${bestSetup?fmtUSD(bestSetup[1]):'尚無資料'}</div></div>`;

  const rangeGroup = document.getElementById('range-group');
  rangeGroup.innerHTML = RANGE_KEYS.map(k => `<button class="range-btn ${state.range===k?'on':''}" data-range="${k}">${RANGE_LABEL[k]}</button>`).join('');
  rangeGroup.querySelectorAll('button').forEach(b => b.onclick = () => { state.range = b.dataset.range; render(); });

  const tbody = document.getElementById('trade-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="11"><div class="empty-state"><h3>${state.trades.length===0?'還沒有任何交易紀錄':'目前篩選條件下沒有交易'}</h3></div></td></tr>`;
  } else {
    tbody.innerHTML = filtered.map(t => {
      const rr = computeRR(t);
      return `<tr data-id="${escapeHtml(t.id)}">
        <td class="mono-cell">${escapeHtml(t.date)}</td><td>${escapeHtml(t.symbol)}</td>
        <td><span class="badge ${t.direction==='long'?'long':'short'}">${t.direction==='long'?'多':'空'}</span></td>
        <td>${escapeHtml(t.setup)||'—'}</td><td class="mono-cell">${escapeHtml(t.entryPrice)||'—'}</td><td class="mono-cell">${escapeHtml(t.exitPrice)||'—'}</td>
        <td class="mono-cell ${Number(t.pnl)>0?'pos':Number(t.pnl)<0?'neg':''}">${fmtUSD(t.pnl)}</td>
        <td class="mono-cell">${rr!==null?rr.toFixed(2)+'R':'—'}</td>
        <td>${escapeHtml(t.emotion)||'—'}</td><td>${(t.mistake&&t.mistake!=='無錯誤')?escapeHtml(t.mistake):'—'}</td>
        <td><button class="icon-btn edit-btn">編輯</button> <button class="icon-btn del-btn" style="color:var(--short);">刪除</button></td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('.edit-btn').forEach(b => b.onclick = (e) => openModal(state.trades.find(t=>t.id===e.target.closest('tr').dataset.id)));
    tbody.querySelectorAll('.del-btn').forEach(b => b.onclick = (e) => { if (confirm('確定要刪除這筆交易？')) deleteTrade(e.target.closest('tr').dataset.id); });
  }

  renderCharts(filtered);
}

function renderCharts(filtered) {
  const asc = [...filtered].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  let cum = 0; const cumLabels=[], cumData=[];
  asc.forEach(t => { cum += Number(t.pnl)||0; cumLabels.push(t.date); cumData.push(Number(cum.toFixed(2))); });

  const setupMap = {};
  filtered.forEach(t => { const k=(t.setup||'未分類').trim()||'未分類'; setupMap[k]=(setupMap[k]||0)+(Number(t.pnl)||0); });
  const setupEntries = Object.entries(setupMap).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const commonOpts = {
    plugins: { legend: { display:false } },
    scales: {
      x: { ticks:{ color:'#5D6C73', font:{size:10} }, grid:{ color:'#2A343B' } },
      y: { ticks:{ color:'#5D6C73', font:{size:10} }, grid:{ color:'#2A343B' } }
    },
    maintainAspectRatio: false
  };

  if (charts.cum) charts.cum.destroy();
  charts.cum = new Chart(document.getElementById('chart-cum'), {
    type: 'line',
    data: { labels: cumLabels, datasets: [{ data: cumData, borderColor:'#D4A24E', backgroundColor:'transparent', tension:.25, pointRadius:0, borderWidth:2 }] },
    options: commonOpts
  });

  if (charts.setup) charts.setup.destroy();
  charts.setup = new Chart(document.getElementById('chart-setup'), {
    type: 'bar',
    data: { labels: setupEntries.map(e=>e[0]), datasets: [{ data: setupEntries.map(e=>e[1]), backgroundColor: setupEntries.map(e=> e[1]>=0 ? '#4FAE8A' : '#C4614A'), borderRadius:3 }] },
    options: commonOpts
  });
}

document.getElementById('dir-filter').onchange = (e) => { state.dir = e.target.value; render(); };
document.getElementById('result-filter').onchange = (e) => { state.result = e.target.value; render(); };
document.getElementById('new-trade-btn').onclick = () => openModal(null);

/* ---------------- trade modal ---------------- */
function openModal(trade) {
  const t = trade ? { ...trade } : { id:null, date:todayStr(), time:'', symbol:'BTC', direction:'long', session:'亞洲盤', setup:'', entryPrice:'', exitPrice:'', stopLoss:'', takeProfit:'', size:'', commission:'', pnl:'', emotion:'專注', mistake:'無錯誤', entryReason:'', exitReason:'', reviewNotes:'' };
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="overlay" id="ov">
    <div class="modal">
      <div class="modal-head"><h2>${t.id?'編輯交易':'新增交易'}</h2><button class="icon-btn" id="close-modal">✕</button></div>
      <div class="modal-body">
        <div class="grid-3">
          <div class="field"><span class="field-label">日期</span><input type="date" id="f-date" value="${escapeHtml(t.date)}"></div>
          <div class="field"><span class="field-label">時間</span><input type="time" id="f-time" value="${escapeHtml(t.time)}"></div>
          <div class="field"><span class="field-label">時段</span><select id="f-session">${SESSIONS.map(s=>`<option ${t.session===s?'selected':''}>${s}</option>`).join('')}</select></div>
        </div>
        <div class="grid-3">
          <div class="field"><span class="field-label">幣種</span><input id="f-symbol" list="symlist" value="${escapeHtml(t.symbol)}"><datalist id="symlist">${SYMBOLS.map(s=>`<option value="${s}">`).join('')}</datalist></div>
          <div class="field"><span class="field-label">方向</span><div class="dir-toggle">
            <div class="dir long ${t.direction==='long'?'on':''}" id="dir-long">做多</div>
            <div class="dir short ${t.direction==='short'?'on':''}" id="dir-short">做空</div>
          </div></div>
          <div class="field"><span class="field-label">策略 Setup</span><input id="f-setup" value="${escapeHtml(t.setup)}"></div>
        </div>
        <div class="grid-4">
          <div class="field"><span class="field-label">進場價</span><input type="number" step="any" id="f-entry" value="${escapeHtml(t.entryPrice)}"></div>
          <div class="field"><span class="field-label">出場價</span><input type="number" step="any" id="f-exit" value="${escapeHtml(t.exitPrice)}"></div>
          <div class="field"><span class="field-label">停損價</span><input type="number" step="any" id="f-stop" value="${escapeHtml(t.stopLoss)}"></div>
          <div class="field"><span class="field-label">停利價</span><input type="number" step="any" id="f-tp" value="${escapeHtml(t.takeProfit)}"></div>
        </div>
        <div class="grid-3">
          <div class="field"><span class="field-label">倉位 (USD 名目)</span><input type="number" step="any" id="f-size" value="${escapeHtml(t.size)}"></div>
          <div class="field"><span class="field-label">手續費 (USD)</span><input type="number" step="any" id="f-comm" value="${escapeHtml(t.commission)}"></div>
          <div class="field"><span class="field-label">損益 PnL (USD)</span><input type="number" step="any" id="f-pnl" value="${escapeHtml(t.pnl)}"></div>
        </div>
        <div class="grid-2">
          <div class="field"><span class="field-label">情緒</span><select id="f-emotion">${EMOTIONS.map(e=>`<option ${t.emotion===e?'selected':''}>${e}</option>`).join('')}</select></div>
          <div class="field"><span class="field-label">錯誤類型</span><select id="f-mistake">${MISTAKES.map(m=>`<option ${t.mistake===m?'selected':''}>${m}</option>`).join('')}</select></div>
        </div>
        <div class="field"><span class="field-label">進場理由</span><textarea rows="2" id="f-entryreason">${escapeHtml(t.entryReason)}</textarea></div>
        <div class="field"><span class="field-label">出場理由</span><textarea rows="2" id="f-exitreason">${escapeHtml(t.exitReason)}</textarea></div>
        <div class="field"><span class="field-label">覆盤筆記</span><textarea rows="3" id="f-notes">${escapeHtml(t.reviewNotes)}</textarea></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" id="cancel-modal">取消</button><button class="btn btn-primary" id="save-modal">${t.id?'儲存變更':'記錄交易'}</button></div>
    </div>
  </div>`;

  let direction = t.direction;
  document.getElementById('dir-long').onclick = () => { direction='long'; document.getElementById('dir-long').classList.add('on'); document.getElementById('dir-short').classList.remove('on'); };
  document.getElementById('dir-short').onclick = () => { direction='short'; document.getElementById('dir-short').classList.add('on'); document.getElementById('dir-long').classList.remove('on'); };

  const close = () => root.innerHTML = '';
  document.getElementById('close-modal').onclick = close;
  document.getElementById('cancel-modal').onclick = close;
  document.getElementById('ov').onmousedown = (e) => { if (e.target.id==='ov') close(); };

  document.getElementById('save-modal').onclick = () => {
    const entry = document.getElementById('f-entry').value, exit = document.getElementById('f-exit').value;
    if (!entry || !exit) { alert('請至少填寫進場價與出場價'); return; }
    const draft = {
      id: t.id, date: document.getElementById('f-date').value, time: document.getElementById('f-time').value,
      session: document.getElementById('f-session').value, symbol: document.getElementById('f-symbol').value.toUpperCase(),
      direction, setup: document.getElementById('f-setup').value,
      entryPrice: entry, exitPrice: exit, stopLoss: document.getElementById('f-stop').value, takeProfit: document.getElementById('f-tp').value,
      size: document.getElementById('f-size').value, commission: document.getElementById('f-comm').value,
      emotion: document.getElementById('f-emotion').value, mistake: document.getElementById('f-mistake').value,
      entryReason: document.getElementById('f-entryreason').value, exitReason: document.getElementById('f-exitreason').value,
      reviewNotes: document.getElementById('f-notes').value,
    };
    const pnlField = document.getElementById('f-pnl').value;
    draft.pnl = pnlField !== '' ? parseFloat(pnlField) : (computePnl(draft) ?? 0);
    saveTrade(draft);
    close();
  };
}

/* ---------------- reset protocol (simplified) ---------------- */
document.getElementById('reset-btn').onclick = () => {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" id="ov2"><div class="modal" style="max-width:420px;">
    <div class="modal-head"><h2>情緒歸零</h2><button class="icon-btn" id="close-r">✕</button></div>
    <div class="modal-body">
      <p style="color:var(--text-dim); font-size:13px; line-height:1.6;">在下一筆交易前，先寫下：是什麼把你拉回市場？下一筆允許的明確 Setup 是什麼？唯一可接受的風控規則是什麼？</p>
      <div class="field"><span class="field-label">衝動來源</span><textarea rows="2" id="r-impulse"></textarea></div>
      <div class="field"><span class="field-label">下一筆允許的 Setup</span><textarea rows="2" id="r-setup"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" id="close-r2">我準備好了</button></div>
  </div></div>`;
  const close = () => root.innerHTML = '';
  document.getElementById('close-r').onclick = close;
  document.getElementById('close-r2').onclick = close;
  document.getElementById('ov2').onmousedown = (e) => { if (e.target.id==='ov2') close(); };
};

initAuth();
</script>
